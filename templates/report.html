<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e4e4e7;--card:#fafafa;--accent:#3b5bdb;
--ok:#2f9e44;--warn:#d9480f;--bad:#c92a2a;--quote:#f1f3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--fg:#ececef;--muted:#9a9aa2;--line:#2c2c31;--card:#1c1c20;--accent:#7c95ff;--quote:#202026}}
:root[data-theme="dark"]{--bg:#141416;--fg:#ececef;--muted:#9a9aa2;--line:#2c2c31;--card:#1c1c20;--accent:#7c95ff;--quote:#202026}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:1.6rem;margin:0 0 4px;line-height:1.25}
h2{font-size:1.25rem;margin:36px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:22px 0 8px}h4,h5{font-size:.95rem;margin:14px 0 4px}
a{color:var(--accent);word-break:break-word}
.muted{color:var(--muted);font-size:.9rem}
.process{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:18px 0;font-size:.93rem}
.process ol{margin:6px 0 0;padding-left:20px}
blockquote{margin:12px 0;padding:12px 16px;background:var(--quote);border-left:4px solid var(--accent);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:var(--card)}
.wrap{overflow-x:auto;margin:10px 0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff;white-space:nowrap}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:.92rem}
details>div{padding:0 16px 12px;font-size:.92rem}
details h2{border-top:0;margin-top:14px;padding-top:0;font-size:1.05rem}
ul,ol{padding-left:22px}
code{font-size:.88em;background:var(--card);padding:1px 4px;border-radius:4px}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:760px){
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr:first-child{display:none}
  table.rt tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--card);padding:6px 10px}
  table.rt td{border:0;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}
  table.rt td .pill{flex:none}
  table.rt td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;flex:0 0 45%}
  table.rt td:first-child{display:block;text-align:left;font-weight:700;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
  table.rt td:first-child::before{content:none}
  .wrap{overflow:visible}
}
</style>
</head>
<body><main>
<h1>{{TITLE}}</h1>
<div class="muted">{{SUBTITLE}}</div>

{{PROCESS_BOX}}

{{VERDICT}}

{{WORKING_FILES}}

<footer>{{FOOTER}}</footer>
</main></body></html>
